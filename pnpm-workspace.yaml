packages:
  - 'apps/*'

# The reused Meet frontend was authored for npm's flat node_modules and relies on
# undeclared (phantom) transitive deps. A hoisted linker mirrors npm and resolves them.
nodeLinker: hoisted

# Allow these packages' install/build scripts to run (native bindings, Prisma engines).
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  core-js: true
  esbuild: true
  prisma: true
  protobufjs: true

# Security fixes of transitive dependencies the direct ones still pin to a
# vulnerable range (pnpm audit --prod). Drop each line once its parent ships it.
overrides:
  # express 4.22.3 → proxy-addr ~2.0.7 (IP spoofing through trusted subnets)
  proxy-addr: 2.0.8
  # express-rate-limit 8.7.0 → ip-address <10.3.1 (leading-zero octets)
  ip-address: 10.7.2
