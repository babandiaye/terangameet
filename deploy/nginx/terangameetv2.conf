# TerangaMeet v2 — reverse proxy vhost (modèle).
# Le backend Node (127.0.0.1:4000) sert À LA FOIS le SPA et l'API sur un seul origine.
#
# Remplacer avant mise en service :
#   meet.example.com        → votre domaine public
#   legacy.example.com      → ancien domaine à rediriger (bloc optionnel, à supprimer sinon)
#   /etc/nginx/ssl/...      → vos certificat et clé TLS
#   minio.example.com:9000  → l'endpoint S3/MinIO servant les médias

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name meet.example.com;
    return 301 https://$server_name$request_uri;
}

# HTTPS
server {
    listen 443 ssl http2;
    server_name meet.example.com;

    ssl_certificate     /etc/nginx/ssl/example.com_cert.pem;
    ssl_certificate_key /etc/nginx/ssl/example.com.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers (inherited by all locations that don't set their own add_header).
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    client_max_body_size 100M;

    access_log /var/log/nginx/terangameetv2_access.log;
    error_log  /var/log/nginx/terangameetv2_error.log;

    # ------------------------------------------------------------------
    # Protection des fichiers et repertoires sensibles.
    #
    # nginx ne sert rien depuis le disque : tout est proxifie vers le backend,
    # qui n'expose que apps/frontend/dist. Ces regles sont donc de la defense
    # en profondeur. Elles coupent les sondes automatisees et neutralisent tout
    # fichier atterrissant par erreur dans dist/ (sauvegarde d'editeur, dump,
    # archive, cle privee, source map).
    #
    # Sans elles, ces chemins renvoient 200 + le index.html du SPA (catch-all
    # Express), ce qui laisse croire a un scanner qu'une ressource existe.
    #
    # Aucun conflit avec les routes applicatives : les identifiants de salle
    # sont de la forme xxx-xxxx-xxx (sans point), et les seules extensions
    # reellement servies sont js, css, html, png, jpg, svg, ico, woff, woff2,
    # mp3, txt et webmanifest -- toutes absentes des listes ci-dessous.
    # ------------------------------------------------------------------

    # Fichiers et repertoires caches (.git, .env, .ssh, .htaccess), sauf ACME.
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    # Repertoires du depot qui ne doivent jamais etre servis.
    location ~ ^/(apps|deploy|docs|prisma|node_modules|dist|src|coverage)(/|$) {
        deny all;
        return 404;
    }

    # Fichiers de configuration, de build et de dependances.
    location ~* ^/(package(-lock)?\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|tsconfig[^/]*\.json|[^/]+\.config\.(js|ts|cjs|mjs)|Dockerfile[^/]*|docker-compose[^/]*|Makefile|LICENSE|README\.md)$ {
        deny all;
        return 404;
    }

    # Noms de fichiers sensibles depourvus d'extension (cles SSH, identifiants).
    location ~* ^/(id_(rsa|dsa|ecdsa|ed25519)|authorized_keys|known_hosts|htpasswd|htaccess|credentials|netrc|wp-config|web\.config)(\.[A-Za-z0-9]+)?$ {
        deny all;
        return 404;
    }

    # Sauvegardes (y compris datees facon fichier.bkp-2026-06-06), dumps,
    # archives, cles privees, source maps et sources non compilees.
    location ~* (~$|\.(bak|bkp|old|orig|save|swp|swo)[-.0-9A-Za-z]*$|\.(tmp|log|sql|sqlite|db|dump|tar|tgz|gz|bz2|zip|rar|7z|pem|key|crt|cer|p12|pfx|map|ini|cfg|conf|yaml|yml|toml|lock|sh|env|ts|tsx|py|rb|php)$) {
        deny all;
        return 404;
    }

    # Recording media served from MinIO (same bucket convention as Meet).
    location /media {
        proxy_pass http://minio.example.com:9000/terangameetv2-media-storage;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Everything else (SPA + /api + /oidc) → Node backend.
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (LiveKit data channel)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # nginx is the TLS edge and authority for these headers: drop the upstream
        # (helmet) copies so the server-level add_header values are the only ones sent.
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
    }
}

# --- Ancien domaine → redirection canonique (optionnel) ---
server {
    listen 80;
    server_name legacy.example.com;
    return 301 https://meet.example.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name legacy.example.com;

    ssl_certificate     /etc/nginx/ssl/example.com_cert.pem;
    ssl_certificate_key /etc/nginx/ssl/example.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    return 301 https://meet.example.com$request_uri;
}
